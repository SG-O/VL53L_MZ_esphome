esphome:
  name: vl53l_mz
  friendly_name: VL53L_MZ

esp32:
  variant: esp32c6
  framework:
    type: esp-idf

external_components:
  - source:
      type: git
      url: https://github.com/SG-O/VL53L_MZ_esphome

# Enable logging
logger:

# Enable Home Assistant API
api:
  encryption:
    key: !secret api_encryption_key

ota:
  - platform: esphome
    password: !secret ota_password

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    ssid: "VL53L_MZ Fallback Hotspot"
    password: !secret wifi_ap_password

captive_portal:

web_server:
  version: 3
  port: 80

i2c:
  - id: bus_a
    sda: GPIO6
    scl: GPIO7
    frequency: 400kHz
    scan: False

vl53l_mz:
  - id: sensor_05
    model: VL53L5CX
    address: 0x30
    i2c_id: bus_a
    reset_pin: GPIO2
    interrupt_pin: GPIO3
    lp_pin: GPIO18
    resolution: 8X8
    ranging_frequency: 1Hz
    ranging_mode: AUTO
    target_order: STRONGEST
    integration_time: 5ms
    sharpening: 14%
    run_xtalk_calibration: false
    continuous_update: false
    update_interval: 1s

  - id: sensor_07
    model: VL53L7CX
    address: 0x31
    i2c_id: bus_a
    lp_pin: GPIO17
    resolution: 8X8
    ranging_frequency: 1Hz
    ranging_mode: AUTO
    target_order: STRONGEST
    integration_time: 5ms
    sharpening: 14%
    run_xtalk_calibration: false
    continuous_update: false
    update_interval: 1s

  - id: sensor_08
    model: VL53L8CX
    address: 0x32
    i2c_id: bus_a
    lp_pin: GPIO16
    resolution: 8X8
    ranging_frequency: 1Hz
    ranging_mode: AUTO
    target_order: STRONGEST
    integration_time: 5ms
    sharpening: 14%
    run_xtalk_calibration: false
    continuous_update: false
    update_interval: 1s

text_sensor:
  - platform: vl53l_mz
    vl53l_mz_id: sensor_05
    name: raw_distance_L5
    output_formatting: CSV
    output_data: RAW_DISTANCE
    flip_x: false
    flip_y: false
  - platform: vl53l_mz
    vl53l_mz_id: sensor_05
    name: float_distance_L5
    output_formatting: CSV
    output_data: FLOAT_DISTANCE
    flip_x: false
    flip_y: false
  - platform: vl53l_mz
    vl53l_mz_id: sensor_05
    name: float_sigma_L5
    output_formatting: CSV
    output_data: RAW_SIGMA
    flip_x: false
    flip_y: false

  - platform: vl53l_mz
    vl53l_mz_id: sensor_07
    name: raw_distance_L7
    output_formatting: CSV
    output_data: RAW_DISTANCE
    flip_x: false
    flip_y: false
  - platform: vl53l_mz
    vl53l_mz_id: sensor_07
    name: float_distance_L7
    output_formatting: CSV
    output_data: FLOAT_DISTANCE
    flip_x: false
    flip_y: false
  - platform: vl53l_mz
    vl53l_mz_id: sensor_07
    name: float_sigma_L7
    output_formatting: CSV
    output_data: RAW_SIGMA
    flip_x: false
    flip_y: false

  - platform: vl53l_mz
    vl53l_mz_id: sensor_08
    name: raw_distance_L8
    output_formatting: CSV
    output_data: RAW_DISTANCE
    flip_x: false
    flip_y: false
  - platform: vl53l_mz
    vl53l_mz_id: sensor_08
    name: float_distance_L8
    output_formatting: CSV
    output_data: FLOAT_DISTANCE
    flip_x: false
    flip_y: false
  - platform: vl53l_mz
    vl53l_mz_id: sensor_08
    name: float_sigma_L8
    output_formatting: CSV
    output_data: RAW_SIGMA
    flip_x: false
    flip_y: false
